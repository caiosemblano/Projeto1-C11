[project]
name = "projeto1-c11"
version = "0.1.0"
description = "Análise das 10 perguntas sobre o Oscar (C11)"
readme = "README.md"
authors = [
    { name = "Caio Semblano", email = "semblanocaio@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "seaborn>=0.13.2",
]

[project.scripts]
projeto1-c11 = "projeto1_c11:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
